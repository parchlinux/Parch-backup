[package]
name = "parch-backup"
version = "0.1.0"
edition = "2021"
default-run = "parch-backup"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
chrono = "0.4.38"
clap = { version = "4.5.4", features = ["derive"] }
ctrlc = "3.4.4"
dialoguer = "0.11.0"
flate2 = "1.0.30"
hkdf = "0.12.4"
rand = "0.8.5"
regex = { version = "1.10.5", features = ["use_std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
tar = "0.4.46"
walkdir = "2.5.0"
crossbeam-channel = "0.5.13"

[dependencies.gtk4]
version = "0.9"
features = ["v4_12"]

[dependencies.libadwaita]
version = "0.7"
features = ["v1_5"]

[lib]
name = "parch_backup"
path = "src/lib.rs"

[[bin]]
name = "parch-backup"
path = "src/main.rs"

[[bin]]
name = "parch-backup-gui"
path = "src/bin/parch-backup-gui.rs"


[profile.release]
opt-level = 3            # Optimize for speed.
lto = true               # Enable Link Time Optimization.
codegen-units = 1        # Fewer codegen units for better optimization.
panic = "abort"          # Abort on panic to reduce binary size.
strip = true             # Remove symbols from the binary.
